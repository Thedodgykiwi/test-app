<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

    <footer>Build: <span id="build">local</span></footer>

  <script src="app.js"></script>

</html>
