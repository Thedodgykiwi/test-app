<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="stage-banner" hidden></div>
  <main class="card">
    <h1>👋 Test App</h1>
    <p>If you can see this, the build &amp; preview pipeline works.</p>
    <p class="new">✨ New in this release: stage promotion test.</p>
    <button id="counter">Clicked 0 times</button>
    <ul id="todos"></ul>
    <form id="todo-form">
      <input id="todo-input" placeholder="Add a to-do…" autocomplete="off" />
      <button type="submit">Add</button>
    </form>
    <footer>
      <span>Build: <span id="build">local</span></span>
      <button type="button" id="whats-new-btn" class="link-btn">📋 What's new</button>
    </footer>
  </main>
  <script src="stage.js"></script>
  <dialog id="whats-new" aria-labelledby="whats-new-title">
    <header>
      <h2 id="whats-new-title">📋 What's new</h2>
      <button type="button" id="whats-new-close" class="close-btn" aria-label="Close">✕</button>
    </header>
    <div id="whats-new-body"></div>
  </dialog>
  <script src="app.js"></script>
  <script src="whats-new.js"></script>
</body>
</html>
