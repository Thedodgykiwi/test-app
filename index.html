<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test App</title>
  <!-- Home-screen / install support. The deploy swaps "local" for each stage's
       icons, name and colour (see .github/workflows/deploy.yml). -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/app/local/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="icons/app/local/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/app/local/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Test Local" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#495057" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="stage-banner" hidden></div>
  <main class="card">
    <!-- Google sign-in (sync.js). Hidden until Firebase is set up and loaded. -->
    <div id="account" class="account" hidden>
      <button type="button" id="sign-in" class="sign-in" hidden><span data-icon="google-logo"></span>Sign in</button>
      <button type="button" id="account-btn" class="avatar-btn" aria-expanded="false" aria-controls="account-menu" hidden>
        <span id="avatar" class="avatar" aria-hidden="true"></span><span id="sync-dot" class="sync-dot" aria-hidden="true"></span>
      </button>
      <div id="account-menu" class="account-menu" hidden>
        <p class="who"><strong id="account-name"></strong><span id="account-email"></span></p>
        <p id="sync-status" class="sync-status"></p>
        <button type="button" id="sign-out" class="plain-btn"><span data-icon="sign-out"></span>Sign out</button>
      </div>
    </div>
    <h1><span data-icon="hand-waving" class="wave"></span>Test App</h1>
    <p>If you can see this, the build &amp; preview pipeline works.</p>
    <!-- Latest release headline (filled in by whats-new.js); hidden until there is one, and after × until the next release -->
    <div id="news" class="news" hidden>
      <button type="button" id="news-open" class="news-open"><span data-icon="sparkle"></span><span class="news-text"><span id="news-label">New:</span> <b id="news-headline"></b></span></button>
      <button type="button" id="news-dismiss" class="news-x" aria-label="Dismiss what's new"><span data-icon="x"></span></button>
    </div>
    <section id="todo-groups" aria-label="To-dos by priority"></section>
    <form id="todo-form">
      <div class="entry">
        <input id="todo-input" placeholder="Add a to-do…" autocomplete="off" aria-label="New to-do" maxlength="500" />
        <!-- Priority for the new to-do: each tap moves none → Low → Medium → High → none -->
        <button type="button" id="new-priority" class="flag-btn p-none" aria-label="Priority for new to-do: No priority. Tap to change" title="Priority: No priority (tap to change)"><span class="word"></span><span data-icon="flag" class="flag-none"></span></button>
      </div>
      <button type="submit"><span data-icon="plus"></span>Add</button>
    </form>
    <footer>
      <span>Build: <span id="build">local</span></span>
      <span class="footer-links">
        <!-- Pipeline page (built by the shared deploy): hidden on local copies, where it doesn't exist -->
        <a id="pipeline-link" class="link-btn" href="pipeline/" hidden><span data-icon="kanban"></span>Pipeline</a>
        <button type="button" id="whats-new-btn" class="link-btn"><span data-icon="sparkle"></span>What's new</button>
      </span>
    </footer>
  </main>
  <script src="stage.js"></script>
  <!-- Edit to-do: a sheet sliding up on phones, a centred card on wider screens -->
  <dialog id="edit-todo" aria-labelledby="edit-todo-title">
    <form id="edit-form" class="edit-form" method="dialog">
      <div class="grab" aria-hidden="true"></div>
      <h2 id="edit-todo-title">Edit to-do</h2>
      <label for="edit-text" class="field-label">To-do</label>
      <textarea id="edit-text" rows="2" maxlength="500" required></textarea>
      <span class="field-label" id="edit-priority-label">Priority</span>
      <div class="chips" role="group" aria-labelledby="edit-priority-label">
        <button type="button" class="chip high" data-p="high" aria-pressed="false"><span data-icon="flag" class="flag-high"></span>High</button>
        <button type="button" class="chip med" data-p="med" aria-pressed="false"><span data-icon="flag" class="flag-med"></span>Medium</button>
        <button type="button" class="chip low" data-p="low" aria-pressed="false"><span data-icon="flag" class="flag-low"></span>Low</button>
        <button type="button" class="chip none" data-p="none" aria-pressed="false"><span data-icon="flag" class="flag-none"></span>None</button>
      </div>
      <div class="edit-actions">
        <button type="button" id="edit-cancel" class="secondary-btn">Cancel</button>
        <button type="submit" id="edit-save">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="whats-new" aria-labelledby="whats-new-title">
    <header>
      <h2 id="whats-new-title"><span data-icon="sparkle"></span><span id="whats-new-title-text">What's new</span></h2>
      <button type="button" id="whats-new-close" class="close-btn" aria-label="Close"><span data-icon="x"></span></button>
    </header>
    <div id="whats-new-body"></div>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="icons.js"></script>
  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
  <script src="whats-new.js"></script>
  <script type="module" src="sync.js"></script>
</body>
</html>
