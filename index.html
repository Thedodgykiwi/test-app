<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="stage-banner" hidden></div>
  <main class="card">
    <h1><span data-icon="hand-waving" class="wave"></span>Test App</h1>
    <p>If you can see this, the build &amp; preview pipeline works.</p>
    <p class="new"><span data-icon="sparkle"></span>New in this release: stage promotion test.</p>
    <button id="counter"><span data-icon="cursor-click"></span><span id="counter-text">Clicked 0 times</span></button>
    <section id="todo-groups" aria-label="To-dos by priority"></section>
    <form id="todo-form">
      <input id="todo-input" placeholder="Add a to-do…" autocomplete="off" aria-label="New to-do" />
      <div class="chips" role="group" aria-label="Priority for new to-do">
        <button type="button" class="chip high" data-p="high" aria-pressed="false"><span data-icon="flag" class="flag-high"></span>High</button>
        <button type="button" class="chip med" data-p="med" aria-pressed="false"><span data-icon="flag" class="flag-med"></span>Medium</button>
        <button type="button" class="chip low" data-p="low" aria-pressed="false"><span data-icon="flag" class="flag-low"></span>Low</button>
      </div>
      <button type="submit"><span data-icon="plus"></span>Add</button>
    </form>
    <footer>
      <span>Build: <span id="build">local</span></span>
      <button type="button" id="whats-new-btn" class="link-btn"><span data-icon="sparkle"></span>What's new</button>
    </footer>
  </main>
  <script src="stage.js"></script>
  <dialog id="whats-new" aria-labelledby="whats-new-title">
    <header>
      <h2 id="whats-new-title"><span data-icon="sparkle"></span><span id="whats-new-title-text">What's new</span></h2>
      <button type="button" id="whats-new-close" class="close-btn" aria-label="Close"><span data-icon="x"></span></button>
    </header>
    <div id="whats-new-body"></div>
  </dialog>
  <script src="icons.js"></script>
  <script src="app.js"></script>
  <script src="whats-new.js"></script>
</body>
</html>
