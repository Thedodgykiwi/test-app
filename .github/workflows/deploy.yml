name: Deploy to GitHub Pages

# Every stage branch deploys. The deploy steps themselves live in ONE shared
# place, the app-playbook repo (.github/workflows/deploy-stages.yml), so all
# apps stay in step. Only the app's name (and optionally colours) go here.
on:
  push:
    branches: [main, staging, dev, alpha]
  workflow_dispatch:

permissions:
  contents: write   # lets the shared deploy create a GitHub release for each Production release
  issues: write     # lets the shared deploy keep the shared issue labels in place
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    uses: Thedodgykiwi/app-playbook/.github/workflows/deploy-stages.yml@main
    with:
      app_name: Test App    # repo files say "Test App Local"
      short_name: Test      # repo files say "Test Local" (home-screen short name)
